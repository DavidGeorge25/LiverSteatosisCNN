# Hepatocyte ballooning -- candidate generation parameters.
#
# Layer with the shared settings:
#   python -m mashpath.features.ballooning.cli segment --slide X.svs \
#       --config configs/core.yaml --config configs/ballooning.yaml
#
# NOT YET TUNED. These are starting points, recorded here so tuning is a config
# change rather than a code change.
#
# Ballooning cannot be pseudo-labelled the way steatosis is. There is no void
# and no clean geometric signature, and the judgment is *relative* to the
# neighbouring hepatocytes -- so the signal is a z-score against a local
# neighbourhood, not an absolute size. Everything that comes out is a CANDIDATE
# for pathologist review, not a detection.

ballooning:

  # ---- 1. segmentation -----------------------------------------------------
  # StarDist gives NUCLEI. Ballooning is a property of the cell body, so nuclei
  # are used as watershed seeds and grown outward into the cytoplasm.
  segmentation:
    model_name: 2D_versatile_he   # RGB H&E in directly; trained near 20x
    model_dir: null               # null = download and cache via StarDist
    level: 0                      # nuclei do not survive a 4x downsample

    prob_threshold: null          # null = the model's own (0.692)
    nms_threshold: null           # null = the model's own (0.3)

    # Extra context read on every side; only cells whose NUCLEAR centroid lands
    # in the core tile are kept, so a cell on a seam is grown against its real
    # surroundings and counted once. Must exceed max_expansion_um in pixels
    # (22 um / 0.4953 = ~44 px) or boundary cells close against the padding.
    margin_px: 96

    norm_low_percentile: 1.0      # percentiles taken from the CORE tile only,
    norm_high_percentile: 99.8    # so edge padding cannot skew the range

    # Nucleus sanity bounds: below is speckle, above is a merged clump.
    min_nucleus_area_um2: 8.0
    max_nucleus_area_um2: 250.0

    # Cell expansion.
    max_expansion_um: 22.0        # hard cap from the nucleus boundary outward
    void_intensity: 215           # brighter = lumen/sinusoid/droplet, not
                                  # cytoplasm; near steatosis' white_threshold
                                  # so droplets read as void, not pale cell
    min_void_area_um2: 15.0       # ...but only if it is big enough to BE a
                                  # lumen. Without this the void mask shatters
                                  # on pale speckle inside rarefied cytoplasm
                                  # -- the ballooning signal itself -- and
                                  # deletes it before it can be measured
    edge_weight: 0.35             # 0 = pure distance tessellation; higher lets
                                  # the boundary follow eosin edges
    edge_smoothing_um: 0.75
    mask_to_tissue: true
    min_cytoplasm_area_um2: 30.0  # below this there is no cytoplasm to measure

    # Which segmented cells count as hepatocytes at all. Endothelial, Kupffer
    # and immune cells are kept as seeds (so they claim their own territory
    # instead of being absorbed) but excluded from the ballooning population.
    min_cell_area_um2: 100.0
    max_cell_area_um2: 5000.0
    min_hepatocyte_nucleus_area_um2: 20.0

  # ---- 2. per-cell features ------------------------------------------------
  # Texture targets the "rarefied" appearance: ballooned cytoplasm is wispy and
  # heterogeneous rather than smoothly eosinophilic. All computed on the
  # cytoplasm compartment only -- the nucleus would dominate every measure.
  features:
    texture_window_um: 2.5        # local std / entropy window; must sit inside
                                  # a cell, not straddle its boundary
    glcm_levels: 32               # keeps the matrix populated at one cell's
                                  # pixel count
    glcm_distances: [1, 3]
    glcm_properties: [contrast, homogeneity, correlation]
    use_color_deconvolution: true # eosin loss is cleaner than overall
                                  # brightness -- not confounded by the nucleus

  # ---- 3. local normalization ---------------------------------------------
  # The step that makes ballooning measurable. Raw values are dominated by
  # staining batch and by zonation; comparing each cell to the cells physically
  # around it removes both, and is how the call is actually made.
  normalization:
    radius_um: 150.0              # a few cell diameters: inside one zone of one
                                  # lobule, but enough cells for a stable median
    min_neighbours: 25            # below this, keep the cell but do not score it
    robust: true                  # median + 1.4826*MAD, not mean + SD: ballooned
                                  # cells are outliers by construction and would
                                  # inflate an SD, shrinking their own z-scores
    min_scale_fraction: 0.05      # floor on the scale, so a uniform
                                  # neighbourhood cannot manufacture a huge z
    reference_hepatocytes_only: true  # immune/endothelial cells would drag the
                                      # local median area down

  # ---- 4. candidate ranking ------------------------------------------------
  ranking:
    # Weighted sum of local z-scores. A starting point, NOT a calibration --
    # there is no ground truth to fit these to yet. That is what the review
    # round produces.
    #
    # Pallor and texture carry the score, NOT size. Deliberate: the territory
    # area is a nuclear-spacing estimate, not a measured cell boundary (it
    # tessellates 91-94% of the tissue and runs ~2x a real mouse hepatocyte,
    # because ~half of hepatocyte profiles in a 4-5 um section have no nucleus
    # in-plane). So it carries stereological noise on the axis that would
    # otherwise dominate. The cytoplasm features do not: they describe the
    # pixels inside the territory, and ballooned cytoplasm is pale and wispy
    # wherever the boundary happens to land.
    weights:
      # primary -- the cytoplasm itself
      z_cyto_eosin_od_mean: -1.0      # rarefaction removes eosin specifically
      z_cyto_local_std_mean: 0.9      # wispy, not smooth
      z_cyto_gray_mean: 0.8           # brighter grey = paler
      z_cyto_entropy_mean: 0.7
      z_cyto_glcm_contrast_d1: 0.5
      z_cyto_glcm_homogeneity_d1: -0.4
      # secondary -- size, downweighted and named for what it is
      z_territory_area_um2: 0.4
      z_nn_distance_um: 0.4           # nuclear spacing, stated plainly
      z_circularity: 0.3              # ballooned cells round up

    # Necessary conditions -- vetoes, not score terms. Ballooning is
    # ENLARGEMENT with rarefaction, so a cell that is not enlarged and rounded
    # cannot be a candidate however pale its cytoplasm is. This split is what
    # makes the noisy territory area usable: as a weighted score term its noise
    # competes with the pallor signal, but as a coarse gate it only has to
    # answer "bigger than its neighbours?", which it does reliably.
    #
    # Without these the top of the ranking fills with hepatocytes compressed
    # into thin slivers between fat droplets -- genuinely pale and genuinely
    # heterogeneous because they are a rim against a white void, while being
    # SMALLER than their neighbours. Verified on R25-264-1.
    # 2.0, set from a pathologist review on 2026-08-16. She rejected EVERY
    # top-ranked candidate with one reason: "they're not enlarged 2-3x".
    # At 1.3 our top band had a median ratio of 1.72x and only 30% reached
    # 2.0x, so most of what we proposed could never have met the criterion.
    # "Over-propose and let the pathologist reject" was the wrong instinct --
    # it spent her attention on cells that were disqualified by definition.
    min_area_ratio: 2.0
    min_solidity: 0.80            # a sliver is ragged; a balloon is convex
    max_eccentricity: 0.85        # a sliver is elongated; a balloon is round
    # 4.0, down from 6.0. The same review flagged a candidate as "not even a
    # single cell" -- a watershed merge passing as one huge cell. A real
    # balloon tops out near 3x, so past 4x is an artefact.
    max_area_ratio: 4.0
    max_cyto_gray_mean: 205.0     # beyond this it is a fat void, not pale
                                  # cytoplasm -- keeps droplets out
    require_nucleus: true         # ballooned cells keep a (displaced) nucleus

    # What the pathologist actually receives. The mid and low bands are not
    # optional: without them the review set is all extremes, the reviewer never
    # sees a near-miss, and the classifier trained on the confirmed set learns
    # a boundary no human was ever shown.
    top_n: 150
    mid_n: 75
    low_n: 75
    mid_percentile_range: [40.0, 60.0]
    low_percentile_max: 20.0
    seed: 0

    max_candidates_per_tile: 20   # ballooning is rare; dozens per tile means
                                  # the parameters are wrong, not the slide

  # ---- 5. review crops -----------------------------------------------------
  crops:
    padding_um: 40.0              # around the cell bbox. The judgment is
                                  # comparative, so the neighbours it is being
                                  # called against must be in frame
    draw_outline: true
    outline_color: [255, 210, 0]
    nucleus_color: [0, 140, 255]
    outline_thickness: 2
    draw_nucleus: true
    save_unmarked: true           # an outline is itself a claim; let the
                                  # reviewer look without it
    contact_sheet_n: 60
    contact_sheet_cols: 10
    contact_sheet_thumb_px: 220

  # ---- segmentation QC -----------------------------------------------------
  # Confirming the cells are real before any feature is built on them.
  qc:
    tiles: 8
    save_native_resolution: true  # downscaled sheets hide the boundary errors
                                  # this pass exists to catch
    nucleus_color: [0, 140, 255]
    cell_color: [255, 210, 0]
    hepatocyte_color: [0, 220, 120]
    thickness: 1
    side_by_side: true            # raw H&E beside the overlay; without it there
                                  # is no way to tell a found boundary from a
                                  # drawn one
